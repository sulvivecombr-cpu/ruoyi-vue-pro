name: yudao-base44

services:
  mysql:
    image: mysql:8
    restart: on-failure
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD: 123456
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql:ro
      - ./sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:6-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: yudao-server/Dockerfile.dev
    restart: on-failure
    volumes:
      - .:/app
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - |
        mvn package -DskipTests -B -pl yudao-server -am -T 2 && \
        exec java -Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom \
          -jar yudao-server/target/yudao-server.jar \
          --spring.datasource.dynamic.datasource.master.url='jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true' \
          --spring.datasource.dynamic.datasource.master.username=root \
          --spring.datasource.dynamic.datasource.master.password=123456 \
          --spring.datasource.dynamic.datasource.slave.url='jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true' \
          --spring.datasource.dynamic.datasource.slave.username=root \
          --spring.datasource.dynamic.datasource.slave.password=123456 \
          --spring.redis.host=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:48080/doc.html"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 420s

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 420s

volumes:
  mysql_data:
